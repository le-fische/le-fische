<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" width="1000px" height="360px" viewBox="0 0 1000 360" font-size="16px">
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
-webkit-size-adjust: 109%;
size-adjust: 109%;
}
.key {fill: #ffa657;}
.value {fill: #a5d6ff;}
.cc {fill: #616e7f;}
.ascii-art {fill: #3fb950; font-weight: 500;}
.flame {fill: #ffa657; animation: pulse 1.2s ease-in-out infinite;}
@keyframes pulse {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 1.0; }
}
text, tspan {white-space: pre;}
</style>
<rect width="1000px" height="360px" fill="#161b22" rx="15"/>

