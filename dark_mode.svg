<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" width="1000px" height="380px" viewBox="0 0 1000 380" font-size="16px">
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
-webkit-size-adjust: 109%;
size-adjust: 109%;
}
.key {fill: #ffa657;}
.value {fill: #a5d6ff;}
.cc {fill: #616e7f;}
.fish {fill: #3fb950; font-weight: 500;}
.bubble {fill: #a5d6ff; animation: float 2.5s ease-in-out infinite;}
@keyframes float {
  0%, 100% { opacity: 0.35; transform: translateY(0px); }
  50% { opacity: 1.0; transform: translateY(-3px); }
}
text, tspan {white-space: pre;}
</style>
<rect width="1000px" height="380px" fill="#161b22" rx="15"/>

